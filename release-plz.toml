[workspace]
changelog_config = "cliff.toml"
git_release_enable = true
git_tag_enable = true
# 0.x defaults would bump a feature as a patch. AGENTS.md documents
# feat as a minor bump, so make the tool match the rule.
features_always_increment_minor = true

# The desktop client ships from the repository, not crates.io
# (desktop/Cargo.toml has `publish = false`).
[[package]]
name = "pulsline-desktop"
release = false
